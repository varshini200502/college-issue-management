databases:
  - name: college-issue-db
    databaseName: college_issue_db
    user: college_admin
    plan: free

services:
  - type: web
    name: college-issue-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-issue-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: PROJECT_NAME
        value: "Centralized College Issue and Ticket Management System"
      - key: API_V1_STR
        value: /api
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: "https://your-app-name.vercel.app"
      - key: SEED_SAMPLE_TICKETS
        value: "false"
