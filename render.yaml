# NOTE: render.yaml is used for the Web Service only.
# PostgreSQL is NOT created by this blueprint — the existing Render PostgreSQL
# server is reused. DATABASE_URL is set manually in the Render dashboard
# pointing to the existing server's college_issue_db database.

services:
  - type: web
    name: college-issue-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard — points to college_issue_db on existing server
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: PROJECT_NAME
        value: "Centralized College Issue and Ticket Management System"
      - key: API_V1_STR
        value: /api
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        sync: false          # Set manually after Vercel deployment URL is known
      - key: SEED_SAMPLE_TICKETS
        value: "false"
